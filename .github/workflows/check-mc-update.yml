name: check for Minecraft update

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: check for updates
        id: check
        run: |
          chmod +x scripts/check-mc-update.sh
          ./scripts/check-mc-update.sh

      - uses: actions/setup-java@v4
        if: steps.check.outputs.updated == 'true'
        with:
          java-version: ${{ vars.JAVA_VERSION || '25' }}
          distribution: 'microsoft'

      - name: validate the update actually builds
        id: build
        if: steps.check.outputs.updated == 'true'
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: commit directly to main
        if: steps.check.outputs.updated == 'true' && steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "chore: bump to Minecraft ${{ steps.check.outputs.new_mc_version }}"
          git push

      - name: open pull request for manual review
        if: steps.check.outputs.updated == 'true' && steps.build.outcome == 'failure'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump to Minecraft ${{ steps.check.outputs.new_mc_version }} (build failed, needs review)"
          title: "[NEEDS REVIEW] Update to Minecraft ${{ steps.check.outputs.new_mc_version }}"
          branch: auto-update/mc-${{ steps.check.outputs.new_mc_version }}
          delete-branch: true
          body: |
            Auto-update found new versions but the build failed with them,
            so this needs a human to look at it. Check the failed build log
            on this workflow run for details.

            - Minecraft: `${{ steps.check.outputs.new_mc_version }}`
            - Fabric Loader: `${{ steps.check.outputs.new_loader_version }}`
            - Fabric API: `${{ steps.check.outputs.new_fabric_api_version }}`
