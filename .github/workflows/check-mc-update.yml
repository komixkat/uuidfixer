name: check for Minecraft update

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: check for updates
        id: check
        run: |
          chmod +x scripts/check-mc-update.sh
          ./scripts/check-mc-update.sh

      - uses: actions/setup-java@v4
        if: steps.check.outputs.updated == 'true'
        with:
          java-version: ${{ vars.JAVA_VERSION || '25' }}
          distribution: 'microsoft'

      - name: validate the update actually builds
        id: build
        if: steps.check.outputs.updated == 'true'
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: update README with supported versions
        if: steps.check.outputs.updated == 'true' && steps.build.outcome == 'success'
        run: |
          chmod +x scripts/update-readme.sh
          ./scripts/update-readme.sh ${{ steps.check.outputs.new_mc_version }}

      - name: commit and push
        if: steps.check.outputs.updated == 'true' && steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: bump to Minecraft ${{ steps.check.outputs.new_mc_version }}"
          fi
          git push origin main

      - name: create or update release tag
        if: steps.check.outputs.updated == 'true' && steps.build.outcome == 'success'
        run: |
          TAG="v${{ steps.check.outputs.new_mc_version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, moving it to the latest build"
            git tag -f "$TAG"
            git push -f origin "$TAG"
          else
            echo "Creating new tag $TAG"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: trigger release workflow
        if: steps.check.outputs.updated == 'true' && steps.build.outcome == 'success'
        run: |
          gh workflow run release.yml -f version=${{ steps.check.outputs.new_mc_version }} --ref main

      - name: open pull request for manual review
        if: steps.check.outputs.updated == 'true' && steps.build.outcome == 'failure'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump to Minecraft ${{ steps.check.outputs.new_mc_version }} (build failed, needs review)"
          title: "[NEEDS REVIEW] Update to Minecraft ${{ steps.check.outputs.new_mc_version }}"
          branch: auto-update/mc-${{ steps.check.outputs.new_mc_version }}
          delete-branch: true
          body: |
            Auto-update found new versions but the build failed with them,
            so this needs a human to look at it. Check the failed build log
            on this workflow run for details.

            - Minecraft: `${{ steps.check.outputs.new_mc_version }}`
            - Fabric Loader: `${{ steps.check.outputs.new_loader_version }}`
            - Fabric API: `${{ steps.check.outputs.new_fabric_api_version }}`